# Déploiement sur serveur dédié : docker compose up -d --build
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://econxstat.ca
    image: econxstat-web:latest
    container_name: econxstat-web
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:3000:3000' # exposé derrière un reverse proxy (Nginx, Caddy, Traefik)
